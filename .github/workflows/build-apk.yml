name: Build APK V3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check uploaded files
        run: |
          test -f pubspec.yaml || { echo "pubspec.yaml is missing - upload it to the repo"; exit 1; }
          test -f tool/patch_android.py || { echo "tool/patch_android.py is missing - upload the tool folder"; exit 1; }
          test -f android/app/build.gradle.kts || { echo "android folder is missing - upload the android folder"; exit 1; }

      # Creates missing android/ files (keeps your lib/, pubspec.yaml and android/app files)
      - name: Create Flutter project files
        run: |
          flutter create --project-name duodeen --org com.duodeen --platforms android .
          rm -f test/widget_test.dart

      # Desugaring + Java 17 + internet + notification settings
      - name: Patch Android settings
        run: python3 tool/patch_android.py

      - name: Get packages
        run: flutter pub get

      # Shows Dart code errors clearly (only real errors stop the build)
      - name: Check Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: DuoDeen-APK
          path: build/app/outputs/flutter-apk/app-release.apk
